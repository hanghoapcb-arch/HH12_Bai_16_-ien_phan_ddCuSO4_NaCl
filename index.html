 const tg=!hasDia?Math.min(1,p*1.2):0;if(dip)bl+=(tg-bl)*Math.min(1,.8*.016);petal.material.color.copy(cl(0xf06292,0xf7f3ee,bl));petal.position.y=dip?-.7:-.75}
const INFO={
 cu:()=>cuAn?{t:'Điện phân CuSO₄ với anode đồng (Cu)',a:'Cu → Cu²⁺ + 2e',c:'Cu²⁺ + 2e → Cu',o:'Cu (anode) → Cu (cathode)',p:'Anode mòn dần, nồng độ CuSO₄ không đổi (màu xanh giữ nguyên), Cu bám lên cathode. Ứng dụng: tinh chế đồng, mạ điện.'}
  :{t:'Điện phân CuSO₄ với điện cực trơ (graphite)',a:'2H₂O → O₂ + 4H⁺ + 4e',c:'Cu²⁺ + 2e → Cu',o:'2CuSO₄ + 2H₂O → 2Cu + O₂ + 2H₂SO₄',p:'Cu đỏ cam bám trên cathode; khí O₂ thoát ra ở anode; màu xanh nhạt dần vì Cu²⁺ giảm, H₂SO₄ tạo thành. Cu²⁺ dễ bị khử hơn H₂O; H₂O dễ bị oxi hoá hơn SO₄²⁻.'},
 na:()=>hasDia?{t:'Điện phân NaCl có màng ngăn xốp',a:'2Cl⁻ → Cl₂ + 2e',c:'2H₂O + 2e → H₂ + 2OH⁻',o:'2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂',p:'Khí Cl₂ (vàng lục, hắc) ở anode; khí H₂ ở cathode; dung dịch quanh cathode chứa NaOH nên phenolphthalein hoá hồng. Na⁺ không bị khử trong dung dịch nước. Ứng dụng: công nghiệp xút – chlorine.'}
  :{t:'Điện phân NaCl không màng ngăn (nước Javel)',a:'2Cl⁻ → Cl₂ + 2e',c:'2H₂O + 2e → H₂ + 2OH⁻',o:'Cl₂ + 2NaOH → NaCl + NaClO + H₂O  ⇒  NaCl + H₂O → NaClO + H₂',p:'Cl₂ tan và phản ứng ngay với NaOH nên bọt Cl₂ nhỏ dần. Thu được NaCl + NaClO (nước Javel) có tính tẩy màu: cánh hoa hồng bị mất màu. Nên đậy nắp để hạn chế khí Cl₂ độc thoát ra.'}};
const PR={cu:{t:'Thí nghiệm: Điện phân dung dịch CuSO₄',h:'dung dịch CuSO₄ 0,5 M.',d:'nguồn điện một chiều (3–6 V), ống thuỷ tinh hình chữ U, hai điện cực than chì, dây dẫn, kẹp kim loại.',
 s:['Lắp thiết bị thí nghiệm điện phân dung dịch CuSO₄ như Hình 16.2.','Rót dung dịch CuSO₄ 0,5 M vào ống thuỷ tinh hình chữ U rồi nhúng hai điện cực than chì vào dung dịch.','Nối hai điện cực than chì với hai cực của nguồn điện và tiến hành điện phân trong khoảng 5 phút (bấm “Bật nguồn”).']},
 na:{t:'Thí nghiệm: Điện phân dung dịch NaCl (tự điều chế nước Javel để tẩy rửa)',h:'dung dịch NaCl bão hoà, cánh hoa màu hồng.',d:'nguồn điện một chiều (3–6 V), cốc thuỷ tinh 100 mL, hai điện cực than chì, dây dẫn, kẹp kim loại.',
 s:['Lắp thiết bị thí nghiệm điện phân dung dịch NaCl với điện cực trơ như Hình 16.3.','Rót khoảng 80 mL dung dịch NaCl bão hoà vào cốc rồi nhúng hai điện cực than chì vào dung dịch.','Nối hai điện cực với hai cực của nguồn điện và tiến hành điện phân trong khoảng 5 phút (bấm “Bật nguồn”).','Cho một mẫu cánh hoa màu hồng vào cốc chứa khoảng 5 mL dung dịch sau điện phân (bấm “Nhúng cánh hoa”).']}};
const QS={cu:[
 ['Quan sát hiện tượng xảy ra ở mỗi điện cực và giải thích.','Cathode: kim loại Cu màu đỏ cam bám lên điện cực vì Cu²⁺ dễ bị khử hơn H₂O. Anode: có khí O₂ thoát ra vì H₂O dễ bị oxi hoá hơn SO₄²⁻.'],
 ['Ion nào di chuyển về anode, ion nào về cathode?','SO₄²⁻ (và OH⁻) di chuyển về anode (+); Cu²⁺ (và H⁺) di chuyển về cathode (−). Electron đi từ anode qua dây dẫn và nguồn tới cathode.'],
 ['Viết quá trình oxi hoá ở anode và quá trình khử ở cathode.','Anode: 2H₂O → O₂ + 4H⁺ + 4e. Cathode: Cu²⁺ + 2e → Cu.'],
 ['Viết phương trình hoá học của phản ứng điện phân.','2CuSO₄ + 2H₂O → 2Cu + O₂ + 2H₂SO₄ (điều kiện: điện phân dung dịch).'],
 ['Màu xanh của dung dịch thay đổi thế nào? Vì sao?','Nhạt dần vì Cu²⁺ bị khử thành Cu, đồng thời tạo H₂SO₄ nên dung dịch có tính acid.'],
 ['Nếu thay anode bằng thanh đồng (Cu) thì hiện tượng thay đổi ra sao? (hãy tích chọn “Anode bằng Cu” để kiểm chứng)','Anode: Cu → Cu²⁺ + 2e nên anode tan dần, không có khí O₂, nồng độ CuSO₄ không đổi. Ứng dụng: tinh chế đồng, mạ điện.']],
 na:[
 ['Viết quá trình oxi hoá, quá trình khử ở mỗi điện cực, biết sản phẩm của quá trình điện phân có khí Cl₂ và H₂.','Anode: 2Cl⁻ → Cl₂ + 2e. Cathode: 2H₂O + 2e → H₂ + 2OH⁻.'],
 ['Viết phương trình hoá học của phản ứng điện phân.','2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂ (có màng ngăn).'],
 ['Trong quá trình điện phân, sản phẩm tạo thành ở hai điện cực khuếch tán vào nhau sẽ xảy ra phản ứng hoá học nào?','Cl₂ + 2NaOH → NaCl + NaClO + H₂O. Tổng quát: NaCl + H₂O → NaClO + H₂.'],
 ['Giải thích hiện tượng quan sát được ở mỗi điện cực.','Anode: Cl⁻ bị oxi hoá thành khí Cl₂ (vàng lục, mùi hắc). Cathode: H₂O bị khử thành khí H₂ và OH⁻ (Na⁺ không bị khử trong dung dịch).'],
 ['Giải thích khả năng tẩy màu của dung dịch sau điện phân.','Dung dịch chứa NaClO (nước Javel) có tính oxi hoá mạnh nên làm mất màu cánh hoa hồng.'],
 ['Tại sao nên dùng nắp đậy trong quá trình điện phân?','Để hạn chế khí Cl₂ độc thoát ra ngoài và giữ lại cho Cl₂ phản ứng với NaOH tạo nước Javel.']]};
function renderInfo(){const i=INFO[mode]();return `<h3 style="margin:0 0 6px;font-size:15px">${i.t}</h3><div class="mu">Anode (+): oxi hoá</div><code class="eq">${i.a}</code><div class="mu">Cathode (−): khử</div><code class="eq">${i.c}</code><div class="mu">Tổng quát</div><code class="eq">${i.o}</code><div class="mu" style="margin-top:6px">${i.p}</div><div class="mu" style="margin-top:6px">Electron (hạt vàng) đi từ anode → cực (+) của nguồn; từ cực (−) của nguồn → cathode.</div>`}
let lt=0,lsig='';
function renderLeft(){const P=PR[mode],t=[1,1,tt>=300?1:0,dip?1:0],cur=t.indexOf(0);
 let h='';if(lt==0)h=`<h3 style="margin:0 0 8px;font-size:15px">${P.t}</h3><p><b><i>Hoá chất:</i></b> ${P.h}</p><p><b><i>Dụng cụ:</i></b> ${P.d}</p><p class="mu">Chuyển sang tab “Tiến hành” để thực hiện từng bước trên mô hình 3D.</p>`;
 else if(lt==1)h=`<ol class="st">${P.s.map((s,i)=>`<li class="${t[i]?'done':i==cur?'cur':''}">${t[i]?'✅':i==cur?'▶️':'⬜'} <b>Bước ${i+1}.</b> ${s}${i==2?` <div class="mu">Mô phỏng: ${String(Math.floor(tt/60)).padStart(2,'0')}:${String(Math.floor(tt%60)).padStart(2,'0')} / 05:00</div>`:''}</li>`).join('')}</ol><p><i>Quan sát hiện tượng xảy ra và trả lời các câu hỏi ở khung bên phải.</i></p>`;
 else h=renderInfo();
 const sig=lt+mode+h;if(sig!==lsig){$('lp').innerHTML=h;lsig=sig}}
function renderQs(){$('qs').innerHTML=QS[mode].map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b><textarea placeholder="Nhập câu trả lời của em…"></textarea><button data-i="${i}">Xem đáp án</button><div class="ans" id="a${i}">${q[1]}</div></div>`).join('');
 $('qs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=$('a'+b.dataset.i);a.classList.toggle('sh');b.textContent=a.classList.contains('sh')?'Ẩn đáp án':'Xem đáp án'})}
function legend(){const ks=mode=='cu'?['cu','so','h']:['na','cl','oh','clo'];$('lgd').innerHTML=ks.map(k=>`<span><i style="background:#${IT[k][0].toString(16).padStart(6,'0')}"></i>${IT[k][2]}</span>`).join('')+'<span><i style="background:#fff;border:1px solid #888"></i>Bọt khí</span><span><i style="background:#ffe14d"></i>Electron e⁻</span>'}
function readout(){const ne=Q/F,mm=Math.floor(tt/60),ss=Math.floor(tt%60),f=(x,d=1)=>x.toFixed(d);let h=`⏱ <b>${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}</b> · I = <b>${f(.2*V,2)}</b> A · Q = <b>${f(Q,0)}</b> C · n(e) = <b>${f(ne*1000,2)}</b> mmol · `;
 if(mode=='cu')h+=`m(Cu) bám cathode: <b>${f(ne/2*63.5,3)}</b> g`+(cuAn?` · Anode tan: <b>${f(ne/2*63.5,3)}</b> g`:` · V(O₂): <b>${f(ne/4*VM*1000,0)}</b> mL · n(H₂SO₄): <b>${f(ne/2*1000,2)}</b> mmol`);
 else h+=`V(H₂): <b>${f(ne/2*VM*1000,0)}</b> mL`+(hasDia?` · V(Cl₂): <b>${f(ne/2*VM*1000,0)}</b> mL · n(NaOH): <b>${f(ne*1000,1)}</b> mmol`:` · n(NaClO): <b>${f(ne/2*1000,1)}</b> mmol`);
 $('ro').innerHTML=h;renderLeft()}
function setMode(m){mode=m;gCu.visible=m=='cu';gNa.visible=m=='na';$('tCu').classList.toggle('on',m=='cu');$('tNa').classList.toggle('on',m=='na');
 $('optCu').style.display=m=='cu'?'':'none';$('optNa').style.display=m=='na'?'':'none';$('bPetal').style.display=m=='na'?'':'none';
 reset();renderQs();legend();readout();fit()}
$('tCu').onclick=()=>setMode('cu');$('tNa').onclick=()=>setMode('na');$('bView').onclick=fit;
$('lt').querySelectorAll('button').forEach(b=>b.onclick=()=>{lt=+b.dataset.t;$('lt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));renderLeft()});
$('cAn').onchange=e=>{cuAn=e.target.checked;reset();readout()};$('cDia').onchange=e=>{hasDia=e.target.checked;reset();readout()};
$('cPh').onchange=e=>phen=e.target.checked;$('cIon').onchange=e=>showIon=e.target.checked;
$('V').oninput=e=>{V=+e.target.value;$('vv').textContent=V};$('spd').onchange=e=>sp=+e.target.value;
$('bRun').onclick=()=>{run=!run;$('bRun').textContent=run?'⏸ Tắt nguồn':'▶ Bật nguồn';$('bRun').className=run?'':'go'};
$('bRst').onclick=()=>{reset();readout()};$('tFs').onclick=()=>$('app').classList.toggle('fs');
$('bPetal').onclick=()=>{if(p<.1)alert('Hãy điện phân thêm một lúc rồi mới lấy mẫu dung dịch.');else dip=true};
function tick(){requestAnimationFrame(tick);const dt=Math.min(.05,clock.getDelta());rt+=dt;
 if(run){tt+=dt*sp;Q+=.2*V*dt*sp;p=Math.min(1,Q/qmax())}
 for(const e of EL){const v=run&&e.g.visible;e.m.visible=v;if(v){e.u=(e.u+dt*2.5*V/4.5/e.L)%1;e.m.position.copy(e.P.getPointAt(e.u))}}
 stepIons(dt);stepBub(dt);colors();if(rt%.1<dt)readout();R.render(S,cam)}
setMode('cu');tick();
